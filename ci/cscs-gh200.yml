include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

UnitTest:
  extends: .baremetal-runner-daint-gh200
  script:
    - export MPICH_GPU_SUPPORT_ENABLED=1
    - srun -n 1 --uenv julia/26.3:v1 --view=juliaup julia --project=. -e 'using Pkg; Pkg.test("Chmy"; test_args=["--backends=CUDA"])'
  variables:
    SLURM_JOB_NUM_NODES: 1
    SLURM_NTASKS_PER_NODE: 1
    SLURM_GPUS_PER_TASK: 1
    SLURM_TIMELIMIT: "00:15:00"

PerfTest:
  extends: .baremetal-runner-daint-gh200
  script:
    - echo "Preparing the test environment (single rank)"
    - export MPICH_GPU_SUPPORT_ENABLED=1
    - srun -n 1 --uenv julia/26.3:v1 --view=juliaup julia --project=. -e 'using Pkg; Pkg.instantiate()'
    # skip auto-precompilation on add: on Julia 1.13.2 it fails with "Unknown package" when the add
    # changes indirect deps (JuliaLang/Pkg.jl#4866), e.g. CUDA downgrading KernelAbstractions 0.10 -> 0.9
    - JULIA_PKG_PRECOMPILE_AUTO=0 srun -n 1 --uenv julia/26.3:v1 --view=juliaup julia --project=. -e 'using Pkg; Pkg.add("CUDA")'
    - srun -n 1 --uenv julia/26.3:v1 --view=juliaup julia --project=. -e 'using Pkg; Pkg.precompile()'
    - echo "Running the reference test (multiple ranks)"
    - srun --uenv julia/26.3:v1 --view=juliaup julia --project=. examples/stokes_3d_inc_ve_T_mpi_perf.jl
  variables:
    SLURM_JOB_NUM_NODES: 2
    SLURM_NTASKS_PER_NODE: 4
    SLURM_GPUS_PER_TASK: 1
    SLURM_TIMELIMIT: "00:10:00"
